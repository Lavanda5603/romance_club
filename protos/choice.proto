syntax = "proto3"; // Версия синтаксиса Protobuf

package romance_club; // Пространство имён

import "action.proto"; // Подключаю action.proto

// Выбор (вариант, видит игрок)
message Choice {
  string text = 1; // Текст выбора
  repeated Action actions = 2; // Действия после выбора
  string title = 3; // Название выбора
  int32 diamond_price = 4; // 0 — бесплатно, платные выборы от 15 до 50
  string premium_key = 5; // Постоянный товар выбора, не зависит от позиции в списке
}