syntax = "proto3"; // Версия синтаксиса Protobuf

package romance_club; package romance_club; // Пространство имён

import "action.proto"; // Подключаю action.proto

// Выбор (вариант, видит игрок)
message Choice {
  string text = 1; // Текст выбора
  repeated Action actions = 2; // Действия после выбора
}