syntax = "proto3"; // Версия синтаксиса Protobuf

package romance_club; // Пространство имён

import "scene.proto"; // Подключаю scene.proto

// Эпизод (одна глава истории)
message Episode {
  int32 id = 1; // Id эпизода
  string title = 2; // Название
  repeated Scene scenes = 3; // Сцены
  int32 version = 4; // Версия
}