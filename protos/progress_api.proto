syntax = "proto3"; // Версия синтаксиса Protobuf

package romance_club; // Пространство имён

import "progress.proto"; // Подключаю progress.proto

// Запрос на получение прогресса
message GetProgressRequest {
  string player_id = 1; // ID игрока
  int32 episode_id = 2; // ID эпизода
}

message GetProgressSummaryRequest {
  string player_id = 1;
}

message GetProgressSummaryResponse {
  repeated int32 episode_ids = 1; // Завершённые эпизоды
}

// Запрос на сохранение прогресса
message SaveProgressRequest {
  string player_id = 1; // ID игрока
  int32 episode_id = 2; // ID эпизода
  string scene_id = 3; // ID сцены как строка
  map<string, bool> flags = 4; // Флаги
  map<string, int32> counters = 5; // Счётчики (баллы)
  string ending = 8; // Концовка подтверждённого прохождения
  bool completed = 7; // Эпизод завершён
  int32 expected_revision = 6; // Версия, которую загрузил клиент
  int32 expected_generation = 9; // Поколение, которое загрузил клиент
}

// Ответ после сохранения
message SaveProgressResponse {
  bool success = 1; // Успешно ли сохранение
  string message = 2; // Сообщение
  int32 revision = 3; // Новая версия сохранения
}

// Запрос на сброс прогресса
message ResetProgressRequest {
  string player_id = 1; // ID игрока
}

// Ответ после сброса
message ResetProgressResponse {
  bool success = 1; // Успешно ли
  string message = 2; // Сообщение
}

// gRPC-сервис для работы с прогрессом
service ProgressApi {
  rpc GetProgress(GetProgressRequest) returns (Progress); // Получить прогресс
  rpc GetProgressSummary(GetProgressSummaryRequest) returns (GetProgressSummaryResponse); // Получить сводку одним запросом
  rpc SaveProgress(SaveProgressRequest) returns (SaveProgressResponse); // Сохранить прогресс
  rpc ResetProgress(ResetProgressRequest) returns (ResetProgressResponse); // Сбросить прогресс
}