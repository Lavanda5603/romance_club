syntax = "proto3"; // Версия синтаксиса Protobuf

package romance_club; // Пространство имён

import "choice.proto"; // Подключаю choice.proto

// Сцена (текст и возможные выборы)
message Scene {
  int32 id = 1; // Id сцены
  string background = 2; // Фон
  string character = 3; // Персонаж
  repeated string texts = 4; // Тексты сцены
  repeated Choice choices = 5; // Выборы
  string condition = 6; // Условие показа
  string text_position = 7; // Позиция текста
  string character_position = 8; // Позиция персонажа
}