syntax = "proto3"; // Версия синтаксиса Protobuf

package romance_club; // Пространство имён

import "choice.proto"; // Подключаю choice.proto

// Сцена (текст и возможные выборы)
message Scene {
  int32 id = 1; // Числовой ID для старых данных
  string title = 2; // Название сцены
  string background = 3; // Фон
  string character = 4; // Персонаж
  repeated string texts = 5; // Тексты сцены
  repeated Choice choices = 6; // Выборы
  string condition = 7; // Условие показа
  string text_position = 8; // Позиция текста
  string character_position = 9; // Позиция персонажа
  string scene_key = 10; // Настоящий ID в SurrealDB
  string character_emotion = 11; // Эмоция персонажа
  int32 next_scene_id = 12; // ID следующей сцены (0 = конец эпизода)
  string next_scene_key = 13; // Ключ следующей сцены (пустой = конец)
  int32 order_index = 14; // Порядок сцены в эпизоде
  repeated SceneRoute routes = 15; // Автоматические переходы: первое выполненное условие
}

message SceneRoute {
  string condition = 1; // Условие перехода
  string scene_key = 2; // Постоянный ключ целевой сцены
}