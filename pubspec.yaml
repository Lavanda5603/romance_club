name: romance_club
description: "Визуальная новелла с выбором действий и сохранением прогресса."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  protobuf: ^6.1.0
  grpc: ^5.1.0
  async: ^2.13.1
  file_picker: ^10.1.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/main_background.png
    - assets/images/
    - assets/images/ep1/
    - assets/images/endings/
    - assets/characters/
    - assets/audio/

# Создаю иконки приложения из моей картинки.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
