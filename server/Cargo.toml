[package]
name = "romance_club_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
surrealdb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
jsonwebtoken = "9"
chrono = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.12"
